name: Language model latency

# One-off measurement from a GitHub-hosted runner: time to the first spoken token of each
# language model provider. Runs on the pull request that adds it, which is never merged.

on:
  pull_request:
    paths:
      - .github/workflows/language-model-latency.yml
      - .github/measurements/language_model_latency.py

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Measure
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run python .github/measurements/language_model_latency.py 4
