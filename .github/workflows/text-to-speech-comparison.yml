name: Text-to-speech comparison

# Compares Deepgram's Aura-2 and Flux TTS voices on the "first token -> first audio" segment of
# the latency budget (manifest §6) and keeps phone-quality samples of every voice, to choose the
# voice by ear. Runs on demand, and on pull requests that change the comparison. Without the
# DEEPGRAM_API_KEY secret the job is skipped with a notice: pull requests from forks never
# receive secrets, and this workflow never runs on `pull_request_target`.

on:
  pull_request:
    paths:
      - "evals/text_to_speech_comparison/**"
      - ".github/workflows/text-to-speech-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: text-to-speech-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deepgram secret present
        id: secrets
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          if [ -z "$DEEPGRAM_API_KEY" ]; then
            echo "::notice::Comparison skipped: the DEEPGRAM_API_KEY secret is not available."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.present == 'true'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        if: steps.secrets.outputs.present == 'true'
        with:
          enable-cache: true
      - if: steps.secrets.outputs.present == 'true'
        run: uv sync --locked
      - name: Compare the voices
        if: steps.secrets.outputs.present == 'true'
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: >-
          uv run python -m evals.text_to_speech_comparison
          --output "$RUNNER_TEMP/text-to-speech-comparison"
      - name: Report in the run summary
        if: always() && steps.secrets.outputs.present == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/text-to-speech-comparison/report.md" ]; then
            cat "$RUNNER_TEMP/text-to-speech-comparison/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Synthetic replies with fictitious data only: safe in a public repository's artifacts.
      - uses: actions/upload-artifact@v7
        if: always() && steps.secrets.outputs.present == 'true'
        with:
          name: text-to-speech-comparison
          path: ${{ runner.temp }}/text-to-speech-comparison
          retention-days: 14
          if-no-files-found: ignore
