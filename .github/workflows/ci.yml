name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked: remove it from the index and rotate its secrets." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
