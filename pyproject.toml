[project]
name = "voice-call-agent"
version = "0.1.0"
description = "Real-time voice call agent for WhatsApp Calling and phone lines, built on Pipecat"
readme = "README.md"
authors = [
    { name = "Luis Romero", email = "135392523+ROMEROLUIS15@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Voice engine and provider SDKs: exact pins, the ecosystem changes every few weeks.
    "pipecat-ai[deepgram,google,groq,silero,webrtc,websocket]==1.12.0",
    "deepgram-sdk==7.13.0",
    "groq==1.7.0",
    "google-genai==2.31.0",
    "openai==3.35.1",
    "twilio==9.12.0",
    # Service framework.
    "aiohttp>=3.11.12",
    "fastapi>=0.146",
    "loguru>=0.7.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54",
    # Rate limiting of the call entries (exact pin: security relevant).
    "limits==5.8.0",
]

[project.scripts]
voice-call-agent = "voice_call_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy>=2.4",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov==7.1.0",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "ASYNC", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The Twilio SDK ships no type information; it is only used inside
# `call_transports/twilio_media_streams/`.
module = ["twilio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["voice_call_agent"]

[tool.coverage.report]
# Constitution §15. Raise it when the dialog lands (phase 2); never lower it to make a change pass.
fail_under = 85
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]
