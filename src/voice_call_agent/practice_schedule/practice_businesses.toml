# Fictitious businesses of the practice schedule (development only). Never real data.
# Names, the greeting and the services are in the callers' language, as a scheduling backend
# would return them. They differ on purpose (kind of business, services, durations that are
# not a multiple of the slot, a service without a price, closed days) so that the evals show
# the agent working for any business, not for one catalog.

# Reached by a call whose dialed number no business lists (a browser practice call that dials
# none, an evals conversation).
default_business = "practice-barbershop"

[[businesses]]
id = "practice-barbershop"
name = "Barbería La Práctica"
timezone = "America/Caracas"
greeting = "Hola, gracias por llamar a Barbería La Práctica. ¿En qué te puedo ayudar?"
slot_minutes = 30
# E.164 numbers that reach this business, as a phone line's dialed number does. The practice
# page offers each one to dial. 555-0100 to 555-0199 are reserved for fiction: no real line.
dialed_numbers = ["+12025550101"]

[[businesses.services]]
id = "haircut"
name = "Corte de cabello"
duration_min = 30
price = "8.00"

[[businesses.services]]
id = "haircut-and-beard"
name = "Corte y barba"
duration_min = 60
price = "12.00"

[[businesses.services]]
