# The booking conversation as a Pipecat Flows graph (ADR 0019): the task of each step, sent to
# the model as a developer message when the call reaches it. The role it keeps throughout is
# booking_prompt.md. {placeholders} are filled in by the code.

[tasks]
request = """Tu tarea ahora: averiguar qué servicio quiere la persona y para qué día. Responde sus preguntas sobre servicios, precios y horario con la información que tienes. Busca el día en el calendario, nunca calcules una fecha: "el próximo lunes" es el primer lunes después de hoy, nunca hoy. Si el día de la semana y la fecha que dice la persona no coinciden en el calendario, pregúntale cuál de los dos quiere. Fuera de eso, no le pidas confirmar el servicio, el día ni la hora: al final el sistema le lee el resumen. En cuanto sepas el servicio y el día, llama a check_availability sin anunciarlo; pasa start si dijo una hora. Si un resultado dice que ese día no se atiende, no tiene horas libres o que el horario ya no está libre, díselo y pide otro día u otra hora."""

choose_time = """Tu tarea ahora: elegir la hora. El sistema acaba de decirle a la persona qué horas quedan. Para {service_name} el {day} quedan estas horas de inicio: {free_times}. {requested}No repitas las horas: espera a que elija, y nunca elijas por ella. Si pregunta por otra hora, respóndele con estos tramos. En cuanto elija una hora de inicio de esos tramos, llama a select_start con ella sin anunciarlo. Si prefiere otro día u otro servicio, llama a check_availability."""

name = """Tu tarea ahora: el nombre. Está libre {service_name}, el {day}, a {time}. Si la persona ya dijo el nombre y apellido de quien va a la cita, llama a propose_booking con ese nombre de inmediato. Si no, pregúntaselo; si la cita es para otra persona, pregunta el nombre de esa persona. Si cambia el servicio, el día o la hora, llama primero a check_availability con lo nuevo. No anuncies la propuesta: el sistema se la lee."""

confirm = """Tu tarea ahora: la confirmación. El sistema acaba de leerle a la persona el resumen de la cita y le preguntó si está bien. Si lo acepta sin cambios, llama a confirm_booking: la cita no existe hasta que la función responde, así que nunca digas que está agendada o confirmada sin ese resultado. Si quiere cambiar algo, duda o dice que no, llama a change_request. No repitas el resumen."""

booked = """Tu tarea ahora: el sistema acaba de decirle a la persona que la cita quedó agendada y le preguntó si necesita algo más. No repitas la confirmación. Si quiere otra cita, llama a new_request; si no, despídete con calidez."""

not_booked = """No se pudo completar: la agenda no responde en este momento. Díselo con calma, sugiere llamar más tarde y despídete. No digas que hay una cita agendada."""

[choices]
# The free times in the choose_time task: said aloud, then as the function takes them.
free_time = "{spoken} ({clock})"
free_range = "de {first} a {last} ({first_clock} a {last_clock})"
interval = ", con inicio cada {minutes} minutos"

# Why the time the caller asked for is not offered.
[choices.requested]
outside_hours = "La hora que pidió, {time}, queda fuera del horario: ese día se atiende de {opens} a {closes} y el servicio dura {duration} minutos. "
off_interval = "La hora que pidió, {time}, no es una hora de inicio: las citas empiezan cada {interval} minutos. "
does_not_fit = "La hora que pidió, {time}, está libre, pero el servicio dura {duration} minutos y no termina antes de la siguiente cita. "
taken = "La hora que pidió, {time}, ya está ocupada. "

# What the code says to the caller on entering the choose_time step: why the time asked for is
# not offered, then the free times, at most four, the closest to the time asked for.
[choices.said]
offer = "{reason}El {day} hay horas libres {times}. ¿Cuál te sirve?"
free_time = "a {time}"
free_range = "de {first} a {last}"
last_joiner = " y "
more = ", entre otras"

[choices.said.reasons]
outside_hours = "A {time} queda fuera del horario de ese día, de {opens} a {closes}. "
off_interval = "A {time} no empieza ninguna cita. "
does_not_fit = "A {time} no alcanza el tiempo antes de la siguiente cita. "
taken = "A {time} ya está ocupado. "
