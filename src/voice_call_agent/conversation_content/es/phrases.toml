# Fixed phrases the agent speaks to the caller, in this locale.
# The generic greeting is spoken when the call has no business; a business's own greeting comes
# from the scheduling backend.

greeting = "Hola, gracias por llamar. ¿En qué te puedo ayudar?"
# A business's greeting when its backend gives only its name.
business_greeting = "Hola, gracias por llamar a {business_name}. ¿En qué te puedo ayudar?"

# The code asks whose name the appointment goes under once a time is chosen, in the same register.
name_ask = "¿A nombre de quién sería la cita?"
# The code reads back the proposal it validated, before the caller's yes (ADR 0019). Neither
# "tú" nor "usted": the register is the business's.
read_back = "Para confirmar: {service}, el {day}, a {time}, a nombre de {name}. ¿Está bien así?"
# The code says the booking is done once the backend confirmed it, in the same register.
booked = "Listo, la cita quedó agendada para el {day}, a {time}. ¿Algo más en lo que pueda ayudar?"

# How the booking prompt states the business's date, hours and services (Monday first).
[booking_briefing]
weekdays = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"]
months = [
    "enero", "febrero", "marzo", "abril", "mayo", "junio",
    "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre",
]
today = "{weekday} {day} de {month} de {year} ({iso_date})"
open_day = "{weekday} de {opens} a {closes}"
closed_day = "{weekday} cerrado"
service = "{name} [{id}]: {minutes} minutos"
price = ", precio {price} {currency}"
no_price = ", precio no publicado"
# The calendar of the coming days: the model looks a day up instead of computing it (ADR 0019).
calendar_day = "{weekday} {day} de {month}{note}: {iso_date}{closed}"
calendar_today = " (hoy)"
calendar_tomorrow = " (mañana)"
calendar_closed = ", cerrado"

# How dates and times are said aloud (the read-back, a day in a tool's result).
# The currency a business gives its prices in (ISO 4217), as it is said.
[booking_briefing.currencies]
USD = "dólares"
VES = "bolívares"
EUR = "euros"
COP = "pesos colombianos"
MXN = "pesos mexicanos"

[spoken_moments]
# 0 to 59, for day numbers and minutes.
numbers = [
    "cero", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez",
    "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho",
    "diecinueve", "veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro", "veinticinco",
    "veintiséis", "veintisiete", "veintiocho", "veintinueve", "treinta", "treinta y uno",
    "treinta y dos", "treinta y tres", "treinta y cuatro", "treinta y cinco", "treinta y seis",
    "treinta y siete", "treinta y ocho", "treinta y nueve", "cuarenta", "cuarenta y uno",
    "cuarenta y dos", "cuarenta y tres", "cuarenta y cuatro", "cuarenta y cinco", "cuarenta y seis",
    "cuarenta y siete", "cuarenta y ocho", "cuarenta y nueve", "cincuenta", "cincuenta y uno",
    "cincuenta y dos", "cincuenta y tres", "cincuenta y cuatro", "cincuenta y cinco",
    "cincuenta y seis", "cincuenta y siete", "cincuenta y ocho", "cincuenta y nueve",
]
day = "{weekday} {day} de {month}"
# The hour on a 12-hour clock, with its article: index 0 is twelve.
hours = [
    "las doce", "la una", "las dos", "las tres", "las cuatro", "las cinco",
    "las seis", "las siete", "las ocho", "las nueve", "las diez", "las once",
]
on_the_hour = "{hour} {day_part}"
past_the_hour = "{hour} y {minutes} {day_part}"
minute_names = { 15 = "cuarto", 30 = "media" }
# The part of the day from each hour on (24-hour clock).
day_parts = [
    [0, "de la madrugada"], [6, "de la mañana"], [12, "del mediodía"], [13, "de la tarde"],
    [20, "de la noche"],
]
