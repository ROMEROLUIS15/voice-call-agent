<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice call</title>
  <script src="/practice/call.js" defer></script>
</head>
<body>
  <h1>Practice call</h1>
  <p>Talk to the agent through this computer's microphone. Use headphones to try interrupting it.</p>
  <p id="line-choice" hidden>
    <label for="practice-line">Number to call</label>
    <select id="practice-line"></select>
  </p>
  <p>
    <button id="start-call" type="button">Start call</button>
    <button id="hang-up" type="button" disabled>Hang up</button>
  </p>
  <p id="call-status" role="status">Ready.</p>
  <audio id="agent-voice" autoplay></audio>
</body>
</html>
