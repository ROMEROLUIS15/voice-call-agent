# Prices used to ESTIMATE the cost of each call. Not an invoice: check the sources when a
# provider changes its prices, update the values and bump `version`.
# A model, voice or channel missing here makes the estimate incomplete, never invented.

version = "2026-10-27.1"

[stt_usd_per_minute]
# https://deepgram.com/pricing (pay as you go): Flux Multilingual
"flux-general-multi" = 0.0078
# Flux English, promotional rate when consulted
"flux-general-en" = 0.0065

[tts_usd_per_1k_characters]
# https://deepgram.com/pricing (pay as you go): every Aura-2 voice
"aura-2" = 0.030
# Every Flux TTS voice (`flux-*`), consulted on 2026-10-26
"flux-" = 0.045

[llm."groq/openai/gpt-oss-120b"]
# https://console.groq.com/docs/model/openai/gpt-oss-120b
usd_per_million_input_tokens = 0.15
usd_per_million_output_tokens = 0.60

[llm."openrouter/openai/gpt-oss-120b"]
# https://openrouter.ai/api/v1/models/openai/gpt-oss-120b/endpoints, consulted 2026-10-27: Groq's
# endpoint. When Cerebras serves a response (0.35 / 0.75) the estimate is marked incomplete.
# Buying OpenRouter credits adds a 5.5 % fee, not per token.
usd_per_million_input_tokens = 0.15
usd_per_million_output_tokens = 0.60
upstream = "Groq"

[telephony_usd_per_minute]
# https://www.twilio.com/en-us/voice/pricing/us: inbound local number 0.0085 + Media Streams 0.0044
twilio = 0.0129
# Browser practice calls: no carrier between the browser and the service.
browser = 0.0
# The business-side cost of WhatsApp calls was not verified: left out on purpose.
