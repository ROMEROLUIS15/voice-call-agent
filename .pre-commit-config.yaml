# The single list of checks, shared by developers and CI (.github/workflows/ci.yml).
#   Every commit (after `uv run pre-commit install`): ruff and gitleaks on the staged changes.
#   Before a push, and in CI:  uv run pre-commit run --all-files --hook-stage manual
default_install_hook_types: [pre-commit]
default_stages: [pre-commit, manual]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [manual]
      - id: pytest
        name: pytest with the coverage threshold
        entry: uv run pytest --cov
        language: system
        pass_filenames: false
        stages: [manual]
      - id: bandit
        name: bandit (static security analysis)
        entry: uv run bandit -c pyproject.toml -r src -q
        language: system
        pass_filenames: false
        stages: [manual]
      - id: pip-audit
        name: pip-audit (known vulnerable dependencies)
        entry: uv run pip-audit --skip-editable --progress-spinner off
        language: system
        pass_filenames: false
        stages: [manual]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (whole git history)
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Without the shellcheck and pyflakes integrations: they run only where those tools are
        # installed, unpinned, so the same workflow would get different verdicts (ADR 0008).
        args: ["-shellcheck=", "-pyflakes="]
        stages: [manual]
